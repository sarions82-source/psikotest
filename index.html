*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 12px}h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 4px}p{margin:0 0 10px}.m{color:var(--mut);font-size:14px}
button{font:inherit;background:var(--ac);color:var(--acx);border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}button:disabled{opacity:.4;cursor:default}
input,select{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin:4px 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.bar{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--ac)}
.ln{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}.ln span{flex:1}
.ln button{padding:8px 12px;min-width:46px;background:transparent;color:var(--mut);border:1px solid var(--bd)}
.ln button.p.on{background:var(--p);color:#fff;border-color:var(--p)}.ln button.k.on{background:var(--k);color:#fff;border-color:var(--k)}
.o{display:block;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:1px solid var(--bd);margin-bottom:8px}.o.on{border-color:var(--ac);outline:2px solid var(--ac)}
.pr{padding:10px 0;border-top:1px solid var(--bd)}.pr>b{display:block;margin-bottom:6px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left;white-space:nowrap}
svg text{fill:var(--tx);font-size:11px}ul{margin:4px 0;padding-left:18px}.tt{font-weight:700;letter-spacing:.03em}.sc{margin-bottom:12px}.sc .bar{margin:4px 0}
body{background-image:linear-gradient(180deg,rgba(1,45,92,.08),transparent 280px);background-repeat:no-repeat}
.hd{background:linear-gradient(135deg,#012d5c 0%,#0a4a8f 100%);color:#fff;border-bottom:4px solid #c32824;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.hi{max-width:760px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px}
.hd h1{color:#fff;margin:0;font-size:22px}.hd p{margin:0;font-size:13px;color:#fff;opacity:.85}
h2{color:var(--nv)}.c{box-shadow:0 1px 3px rgba(1,45,92,.08)}
@page{size:A4;margin:14mm}@media print{body{background:#fff}.no{display:none}.c{break-inside:avoid}}

 suka menganalisa masalah sendirian daripada bersama orang lain. Rasa egoisnya yang kuat membuatnya tidak nyaman di bawah kendali orang lain; ia lebih suka menjadi \"boss\" dan menetapkan standard tinggi baik untuk dirinya maupun orang lain. Ia menghindari sesuatu yang biasa-biasa dan cenderung mencari tantangan yang baru. Ia menyukai petualangan dan kadang-kadang beralih ke dalam petualangan baru sebelum mempertimbangkannya secara menyeluruh. Mampu memimpin situasi dan orang lain dalam rangka mencapai sasarannya; ia ingin selalu unggul dalam persaingan dengan taruhan apapun."},{"label":"D / C-D","title":"DESIGNER","traits":["Sensitif","Kurang Cepat","Anti Tekanan","Terlalu Mandiri","Kurang Percaya Orang Lain","Anti Kritik","Dingin","Kreatif","Result Oriented","Suka Tantangan"],"job":"Engineering (Management, Research, Design), Research (R&D), Planning, Chemist, Accountancy, Specialist, Finance, Technician, Quality Control, Production Planning/Management, Design Engineer, Bookkeeper, Chemist Technician, Safety Officer, Librarian.","desc":"Seorang yang sangat berorientasi pada tugas dan sensitif pada permasalahan. Ia lebih mempedulikan tugas yang ada dibanding orang-orang di sekitarnya, termasuk perasaan mereka. Sangat kukuh/keras dan mempunyai pendekatan yang efektif dalam pemecahan masalah. Oleh karena sifat alamiah dan keinginannya akan hasil yang terukur, Akan tampak dingin, tidak berperasaan dan menjaga jarak. Ia membuat keputusan berdasar pada fakta, bukan emosi. Cenderung pendiam dan tidak mudah percaya."},{"label":"D / I-D","title":"NEGOTIATOR","traits":["Suka Bergaul","Anti Rutin","Aktif","Terlalu Percaya Diri","Agresif","Optimis","Kurang Detail","Result Oriented"],"job":"Sales and Marketing (Directing, Manager, Person), Public Relations, Recruitment Consultant, Politician, Director, Self-Employed, Hotelier, Travel Agent, Trainer, Hospitality, Lawyer, Solicitor, Motivators, Team Leader, Politician, Trainer, Lecturer, Theatrical Agent, General Management and Leading People, Attorney.","desc":"Merupakan seorang pemimpin integratif yang bekerja dengan dan melalui orang lain. Ia ramah, memiliki perhatian yang tinggi akan orang dan juga mempunyai kemampuan untuk memperoleh hormat dan penghargaan dari berbagai tipe orang. Melakukan pekerjaannya dengan cara yang bersahabat, baik dalam mencapai sasarannya maupun meyakinkan pandangannya kepada orang lain. Ia tidak begitu memperhatikan hal-hal kecil. Kadang bertindak sesuai dengan kata hati/impulsif, terlalu antusias dan sangat banyak bicara. Ia terlalu berlebihan menilai kemampuannya dalam memotivasi atau mengubah perilaku orang lain. Mencari kebebasan dari rutinitas, menginginkan otoritas/wewenang dan juga prestise. Ia menginginkan aktivitas yang bervariasi dan bekerja lebih efisien jika data-data analitis disediakan oleh orang lain. Menginginkan penugasan yang mengutamakan mobilitas dan tantangan."},{"label":"D / I-D-C","title":"CONFIDENT & DETERMINED","traits":["Pandai Memilih Orang","Leader","Good Interpersonal Skill","Dominan","Agresif","Perfeksionis","Good Communication Skill","Aktif","Need Recognition n Reward","Kurang Peduli pada Aturan","Terburu-buru"],"job":"Specialist/Technical Selling (Computer, Finance, Engineer and others, Chef, Technical/Capital Equipment Selling), Financial (Manager, Specialist), Computer Hardware Sales, Engineering (Manager, Designer, Buyer, Draughtsman), Project Engineer, Sales Engineer, Consultant, Trainer, Lecturer, Hotelier, Insurance, Mortgage and Finance Sales, Teacher, Travel Agent, Personnel and Marketing Services.","desc":"Sangat berorientasi terhadap tugas dan juga menyukai orang. Ia sangat baik dalam menarik orang/recruiting. Seorang yang bersahabat, tetapi menyukai keadaan di mana tugas-tugas harus dilakukan dengan benar. Ia kadang-kadang tampak dingin dan mendominasi. Ia juga bisa sangat fokus pada tugas dan melupakan orang-orang di sekitarnya. Sangat mengharapkan orang-orang terlibat dalam proyeknya, tetapi tidak memperdulikan apa yang diinginkan oleh orang-orang itu. Ia perlu mendengar dan memikirkan apa yang menjadi keinginan orang di sekitarnya, khususnya kesempatan untuk mencoba. Ia sangat membutuhkan persetujuan sosial seperti halnya ia sangat mempercayai orang lain. Karena itu, ia kadang-kadang berlebihan dalam menilai orang dan kemampuannya. Ia tampak tidak konsisten dan tidak karuan karena ketidakmampuannya berkonsentrasi dan fokus dalam waktu yang lama. Perlu belajar untuk secara sungguh-sungguh mendengarkan orang-orang di sekitarnya dari pada selalu berpikir apa yang ingin dikatakan. Ia mempunyai kemampuan logika yang tinggi ketika ia mau menggunakannya."},{"label":"D / I-D-S","title":"REFORMER","traits":["Mudah Bergaul","Leader","Sadar Diri","Butuh Pujian & Penghargaan","Cepat Percaya Orang","Mudah Simpati & Empati","Motivator","Optimis & Positif","Anti Aturan","Kurang Detail","Terlalu Selektif"],"job":"Hotelier, Customer Service, Complaints Manager, Recruiting Agent, Sales (Manager/Person), Marketing Services, Public Relations, Politician, Computer Software Sales, Lecturer, Engineering and Production (Manager/Supervisor).","desc":"Seorang yang bersahabat dan sosial; ia juga suka mengendalikan situasi dan menjadi pemimpin. Ia menyelesaikan tugasnya melalui keterampilan sosialnya; ia peduli dan menerima orang lain. Ia berkonsentrasi pada tugas yang ada di tangannya sampai selesai dan akan minta bantuan orang lain jika perlu. Ia menyadari keterbatasannya dan meminta bantuan jika memerlukannya. Ia disukai dan orang ingin menolongnya. Senang membagi kebanggaannya dengan kelompok; ia seorang team player tetapi juga team leader. Menginginkan popularitas dan pengakuan."},{"label":"D / I-S-D","title":"MOTIVATOR","traits":["Leader (Kelompok Kecil)","Supporter","Sosialisasi Baik","Butuh Ketegasan","Butuh Pujian & Penghargaan","Kurang Detail","Agak Kaku"],"job":"Hotelier, Community Counseling, Customer Service, Complaints Manager, Community Work, Recruitment Consultant, Hospitality, Teacher, Telemarketing, Production Manager, Complaints Manager, Recruiting Agent, Sales (Manager/Person), Marketing Services, Public Relations, Politician, Call Centre Manager, Lecturer, Engineering and Production (Manager/Supervisor).","desc":"Seorang yang menampilkan gaya bersemangat ketika termotivasi pada sasaran. Ia lebih suka memimpin atau melibatkan diri, walaupun ia juga mau melayani sebagai pembantu. Ia membutuhkan pengakuan dan penghargaan serta senang pada peran pendukung. Ia peduli kepada orang-orang di sekitarnya dan akan mempertimbangkan perasaan orang lain dalam proses pengambilan keputusan. Menampilkan keterampilan berhubungan dan berkomunikasi dengan sangat baik. Ia akan berusaha keras menyelesaikan tugas dengan cepat dan efisien."},{"label":"D / S-D-C / S-C-D","title":"INQUIRER","traits":["Full Self Control","Sabar","Penuh Pertimbangan","Good Interpersonal","Selektif","Lambat Adaptasi","Inisiatif kurang","Result Oriented","Kaku dan Keras Kepala","Good Service","Kurang dlm hal Managerial"],"job":"Directing, Managing or Supervising (in Engineering, Accountancy, Research and Development and Computing disciplines), Research Manager, Scientific Work, Accountant, Administration, Project Engineer, Draughtsman, Designer, Analyst, Finance, Chemist, Technical Service Support, Flight Attendant, Technician, Service Engineer, Service Manager, Security Specialist.","desc":"Seorang yang sabar, terkontrol dan suka menggali fakta dan jalan keluar. Ia tenang dan ramah. Ia merencanakan pekerjaan dengan hati-hati, tetapi agresif, menanyakan sesuatu serta mengumpulkan data pendukung. Kemudian ia bekerja dengan konsisten dengan arahan yang benar. Menjadi individu yang penuh perhatian, rendah hati, dan ia berhubungan baik dengan hampir semua orang. Seorang yang konsisten dan suka menolong. People skill darinya melebihi orientasi tugasnya."},{"label":"D-I","title":"PENGAMBIL KEPUTUSAN","traits":["Pekerja Keras","Leader","Banyak Minat","Dingin / Task Oriented","Kurang Pergaulan"," r manusia. Tidak berorientasi detil, ia fokus pada target secara keseluruhan dengan menyerahkan hal detil kepada orang lain. Enerjik dan sosial, ia mampu memotivasi orang lain sambil menyelesaikan pekerjaannya. Ia menampilkan rasa percaya diri dan mampu meyakinkan orang lain. Sekali ia memutuskan sesuatu, ia akan terus mengerjakannya dan bertahan sampai selesai."},{"label":"D-S","title":"SELF-MOTIVATED","traits":["Objektif & Analitis","Mandiri","Good Planner","Komitmen thd Target","Menghindari Konflik"],"job":"Engineering and Production (Directing, Managing, Supervising), Project Management, Researcher, Chemist (R&D), Planner, Engineering (R&D), Systems Analyst, Commercial Planner, Computer Engineer, Programmer, IT, Other computer-related disciplines, Technical Trouble Shooting and Directing, Lawyer, Solicitor, Development Engineer, Work Study, Barrister, Attorney.","desc":"Seorang yang obyektif dan analitis. Ia ingin terlibat dalam situasi, dan ia juga ingin memberikan bantuan dan dukungan kepada orang yang ia hormati. Secara internal termotivasi oleh target pribadi, ia berorientasi terhadap pekerjaannya tapi juga menyukai hubungan dengan sesama. Karena determinasinya yang kuat, ia sering berhasil dalam berbagai hal; karakternya yang tenang, stabil dan daya tahannya yang tinggi memiliki kontribusi dalam keberhasilannya. Ulet dalam memulai pekerjaan. Ia akan berusaha keras untuk mencapai sasarannya. Seorang yang mandiri dan cermat serta memiliki tindak lanjut yang baik."},{"label":"I / C-I-S","title":"MEDIATOR","traits":["Loyal","Tight Scheduled","Curious","Sensitif","Good Communication Skill","Good Analitical Think","Good Interpersonal Skill","Cepat Beradaptasi","Anti Kritik","Not Leader","Work/Play Conflict"],"job":"Engineering and Production (Supervisor, Installer, Technician, Service and Design), Research (Supervisor, Chemist, Lab. Technician), Trainer, Finance (Supervisor, Accountant, Advisor), Public Relations, Administration, Office Administrator, Market Anal function look(t,k){const ks=Object.keys(t).map(Number).sort((a,b)=>a-b);let r=ks[0];for(const x of ks)if(x<=k)r=x;return t[r]}
function calc(P,K){const p={D:0,I:0,S:0,C:0,"*":0},k={D:0,I:0,S:0,C:0,"*":0};
for(let n=0;n<24;n++){p[DATA.pm[n][P[n]]]++;k[DATA.km[n][K[n]]]++}
const mk=(t,f)=>{const o={};"DISC".split("").forEach((x,j)=>o[x]=look(t,f(x))[j]);return o};
const L=[mk(DATA.t1,x=>p[x]),mk(DATA.t2,x=>k[x]),mk(DATA.t3,x=>p[x]-k[x])];
return{p,k,L,idx:L.map(v=>DATA.pat.findIndex(c=>c.every(([a,o,b])=>{const x=v[a],y=b==="0"?0:v[b];return o===">"?x>y:o==="<="?x<=y:x>=y})))}}

function papiCalc(A){return PAPI.sc.map(s=>{let v=0;s.c.forEach(([n,l])=>{if(A[n-1]===l)v++});const t=s.t.find(x=>v<=x[0]);return{...s,v,x:t?t[1]:s.e}})}

return{n,e,tot:sum(n),pan:sum(n)/n.length,tian:sum(e),jan:Math.max(...n)-Math.min(...n),han:sum(n.slice(h))/Math.max(n.length-h,1)-sum(n.slice(0,h))/h}}
function lc(v,title,col){const W=300,H=150,m=Math.max(...v,1),X=j=>30+(W-40)*(v.length>1?j/(v.length-1):0),Y=n=>H-20-(H-40)*n/m;
return `<div><h3>${title}</h3><svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="30" x2="${W-10}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mut)"/><text x="2" y="${Y(m)+4}">${m}</text><text x="2" y="${Y(0)+4}">0</text><polyline fill="none" stroke="${col}" stroke-width="2" points="${v.map((n,j)=>X(j)+","+Y(n)).join(" ")}"/><text x="30" y="${H-4}">Kolom 1</text><text x="${W-62}" y="${H-4}">Kolom ${v.length}</text></svg></div>`}
function bodyKrp(rec){const r=krpCalc(rec.C),f=x=>Math.round(x*100)/100,M=(n,v)=>`<div><p class="m" style="margin:0">${n}</p><p class="tt" style="font-size:22px;margin:0">${v}</p></div>`;
return `<div class="c"><h2>Hasil Kraepelin</h2><div class="g">${M("Panker (kecepatan)",f(r.pan))}${M("Tianker (ketelitian: jumlah salah)",r.tian)}${M("Janker (kestabilan)",r.jan)}${M("Hanker (ketahanan)",f(r.han))}${M("Total dikerjakan",r.tot)}</div>
<p class="m" style="margin-top:10px">Panker = rata-rata angka dikerjakan per kolom. Tianker = total jawaban salah. Janker = selisih kolom tertinggi dan terendah. Hanker = rata-rata paruh kedua dikurangi paruh pertama (positif berarti kerja membaik). Kategori (rendah/sedang/tinggi) mengikuti tabel norma lembaga Anda.</p></div>
<div class="c"><h2>Kurva kerja</h2><div class="g">${lc(r.n,"Dikerjakan per kolom","var(--ac)")}${lc(r.e,"Kesalahan per kolom","var(--k)")}</div></div>
<div class="c"><h2>Rekap per kolom</h2><div class="tw"><table><tr><th>Kolom</th>${r.n.map((_,j)=>`<th>${j+1}</th>`).join("")}</tr><tr><td>Dikerjakan</td>${r.n.map(x=>`<td>${x}</td>`).join("")}</tr><tr><td>Salah</td>${r.e.map(x=>`<td>${x}</td>`).join("")}</tr></table></div></div>`}
function thanks(sh){V.innerHTML=`<div class="c"><h2>Terima kasih</h2><p>${sh==="ok"?"Jawaban Anda sudah terkirim. Anda boleh menutup halaman ini.":"Jawaban gagal terkirim ke server. Hubungi penyelenggara tes."}</p>${locked?"":`<button id="bk">Kembali ke menu</button>`}</div>`;if(!locked)bk.onclick=home}
function chart(v,title){const X=j=>40+70*j,Y=n=>100-n*11,pts="DISC".split("").map((c,j)=>[X(j),Y(v[c])]);
return `<div><h3>${title}</h3><svg viewBox="0 0 300 215" width="100%">${[-8,-4,4,8].map(n=>`<line x1="20" x2="290" y1="${Y(n)}" y2="${Y(n)}" stroke="var(--bd)"/><text x="2" y="${Y(n)+4}">${n}</text>`).join("")}
<line x1="20" x2="290" y1="100" y2="100" stroke="var(--mut)"/><text x="2" y="104">0</text><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${pts.map(p=>p.join(",")).join(" ")}"/>
${pts.map((p,j)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--ac)"/><text x="${p[0]-10}" y="${p[1]+(v["DISC"[j]]>=0?-9:16)}">${v["DISC"[j]]}</text><text x="${p[0]-4}" y="208" class="tt">${"DISC"[j]}</text>`).join("")}</svg></div>`}
function prof(n,idx){const d=DATA.defs[idx];return d?`<div><h3>${n}</h3><p class="tt">${esc(d.title)} <span class="m">(${esc(d.label)})</span></p><ul>${d.traits.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:`<div><h3>${n}</h3><p class="m">Pola tidak teridentifikasi.</p></div>`}
function bodyDisc(rec){const r=calc(rec.P,rec.K),d=DATA.defs[r.idx[2]],t=j=>DATA.defs[r.idx[j]];
return `<div class="c"><div class="g">${["Mask","Core","Mirror"].map((n,j)=>`<div><p class="m" style="margin:0">${n}</p><p class="tt" style="font-size:20px;margin:0">${esc(t(j)?.title||"-")}</p><p class="m" style="margin:0">${esc(t(j)?.label||"")}</p></div>`).join("")}</div></div>
<div class="c"><h2>Grafik DISC</h2><div class="g">${chart(r.L[0],"Grafik I · Mask (Public Self)")}${chart(r.L[1],"Grafik II · Core (Private Self)")}${chart(r.L[2],"Grafik III · Mirror (Perceived Self)")}</div></div>
<div class="c"><h2>Gambaran karakter</h2><div class="g">${prof("Mask · Public Self",r.idx[0])}${prof("Core · Private Self",r.idx[1])}${prof("Mirror · Perceived Self",r.idx[2])}</div></div>
${d?`<div class="c"><h2>Deskripsi kepribadian</h2><p>${esc(d.desc)}</p><h3>Job match</h3><p>${esc(d.job)}</p></div>`:""}
<div class="c"><h2>Rekap jawaban</h2><div class="tw"><table><tr><th></th><th>Line 1 (P)</th><th>Line 2 (K)</th><th>Line 3 (P − K)</th></tr>${["D","I","S","C","*"].map(x=>`<tr><td>${x}</td><td>${r.p[x]}</td><td>${r.k[x]}</td><td>${r.p[x]-r.k[x]}</td></tr>`).join("")}</table></div></div>`}
function bodyPapi(rec){const R=papiCalc(rec.A);let g="",h="";
R.forEach(r=>{if(r.u!==g){if(g)h+="</div>";g=r.u;h+=`<div class="c"><h2>${esc(g)}</h2>`}h+=`<div class="sc"><div class="row"><b>${r.k} · ${esc(r.f)}</b><span class="tt">${r.v} / 9</span></div><div class="bar"><i style="width:${r.v/9*100}%"></i></div><p class="m">${esc(r.x)}</p></div>`});
return `<div class="c"><h2>Profil skor PAPI Kostick</h2><div class="tw"><table><tr>${R.map(r=>`<th>${r.k}</th>`).join("")}</tr><tr>${R.map(r=>`<td>${r.v}</td>`).join("")}</tr></table></div><p class="m" style="margin-top:8px">Skor tiap faktor 0–9.</p></div>${h}</div>`}
function result(rec,adm,sh){const papi=rec.test==="papi",krp=rec.test==="kraepelin",inc=krp?0:papi?rec.A.filter(x=>x<0).length:rec.P.filter(x=>x<0).length+rec.K.filter(x=>x<0).length;
V.innerHTML=`<div class="c"><div class="row"><div><h2>${esc(rec.name)} <span class="m">· ${papi?"PAPI Kostick":krp?"Kraepelin":"DISC"}</span></h2><p class="m">${esc(rec.sex)} · ${esc(rec.age)} tahun · ${esc(rec.date)}${rec.minutes?" · durasi "+rec.minutes+" menit":""}</p>${inc?`<p class="tt" style="color:var(--k)">Tes tidak lengkap: ${inc} jawaban kosong${rec.auto?" (waktu habis)":""}. Hasil tidak dapat dianggap valid.</p>`:""}${sh==="ok"?`<p class="m">Hasil juga tersimpan di penyimpanan bersama.</p>`:sh==="fail"?`<p class="m">Penyimpanan bersama tidak tersedia; hasil hanya tersimpan di perangkat ini.</p>`:""}</div>
<div class="no"><button class="s" id="pr">Cetak</button> <button class="s" id="dl">Unduh laporan</button> <button id="bk">${adm?"Kembali":"Selesai"}</button></div></div></div>
${papi?bodyPapi(rec):krp?bodyKrp(rec):bodyDisc(rec)}<p class="m">Hasil bersifat indikatif dan perlu diinterpretasikan oleh psikolog atau asesor yang berwenang.</p>`;
pr.onclick=()=>{try{window.print()}catch(e){}};
dl.onclick=async()=>{const h=`<!DOCTYPE html><html lang="id" data-theme="light"><head><meta charset="utf-8"><title>Laporan ${esc(rec.name)}</title><style>${document.querySelector("style").textContent}</style></head><body><header class="hd"><div class="hi"><img src="${LOGO}" alt="Logo" style="height:56px;width:56px;object-fit:contain;background:#fff;border-radius:10px;padding:4px"><div><h1>Laporan Hasil Tes</h1></div></div></header><div class="w" style="padding-top:18px">${V.innerHTML.replace(/<div class="no">[\s\S]*?<\/div>/,"")}<p class="m" style="font-size:12px;line-height:1.4;margin-top:28px;padding-top:12px;border-top:1px solid var(--bd)">Hak cipta © Alumni Universitas Teknologi Surabaya (UTS)<br>Fakultas Magister Manajemen Sumber Daya Manusia (M.M)</p></div></body></html>`,fn="laporan-"+rec.test+"-"+rec.name.replace(/\W+/g,"-")+".html";
if(DL){try{await DL.save({filename:fn,data:h});return}catch(e){}}dlf(fn,h,"text/html")};
bk.onclick=adm?admin:(locked?()=>thanks("ok"):home)}
function dlf(n,t,y){const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([t],{type:y}));l.download=n;l.click()}
function admin(){clearInterval(tk);if(!okAdm)return login();ST.list().then(adminView)}
function login(msg){const nw=ST.needNew();V.innerHTML=`<div class="c"><h2>${nw?"Buat PIN admin":"Masuk admin"}</h2><p class="m">${nw?"Buat PIN (minimal 4 karakter) untuk perangkat ini.":MODE==="web"?"Masukkan password admin.":"Masukkan PIN admin."}</p><input id="pn" type="password"><div class="row"><span id="pe" class="m">${msg||""}</span><button id="pk">${nw?"Simpan PIN":"Masuk"}</button></div></div>`;
pn.onkeydown=e=>{if(e.key==="Enter")pk.click()};pk.onclick=async()=>{pk.disabled=true;const r=await ST.login(pn.value,nw);if(r===true){okAdm=true;admin()}else login(r)}}
function groups(a){const m=new Map();a.forEach(x=>{const k=String(x.name).trim().toLowerCase();if(!m.has(k))m.set(k,{name:String(x.name).trim(),recs:[]});m.get(k).recs.push(x)});return[...m.values()]}
const TN=t=>t==="papi"?"PAPI":t==="kraepelin"?"Kraepelin":"DISC";
function grp(G){return `<h3>Laporan gabungan per kandidat</h3><div class="tw"><table><tr><th>Kandidat</th><th>Tes</th><th></th></tr>${G.map((g,n)=>`<tr><td>${esc(g.name)}</td><td>${[...new Set(g.recs.map(x=>x.test||"disc"))].map(TN).join(", ")}</td><td><button class="s" data-g="${n}">Laporan gabungan</button></td></tr>`).join("")}</table></div><h3 style="margin-top:18px">Semua hasil</h3>`}
const latest=(rs,t)=>rs.filter(r=>(r.test||"disc")===t).sort(byT)[0];
function repDoc(inner,name){return `<!DOCTYPE html><html lang="id" data-theme="light"><head><meta charset="utf-8"><title>Laporan ${esc(name)}</title><style>${document.querySelector("style").textContent}</style></head><body><header class="hd"><div class="hi"><img src="${LOGO}" alt="Logo" style="height:56px;width:56px;object-fit:contain;background:#fff;border-radius:10px;padding:4px"><div><h1>Laporan Hasil Tes</h1></div></div></header><div class="w" style="padding-top:18px">${inner}<p class="m" style="font-size:12px;line-height:1.4;margin-top:28px;padding-top:12px;border-top:1px solid var(--bd)">Hak cipta © Alumni Universitas Teknologi Surabaya (UTS)<br>Fakultas Magister Manajemen Sumber Daya Manusia (M.M)</p></div></body></html>`}
function combined(g){const d=latest(g.recs,"disc"),p=latest(g.recs,"papi"),k=latest(g.recs,"kraepelin"),x0=g.recs[0],f=n=>Math.round(n*100)/100;let s="";
if(d){const r=calc(d.P,d.K),n=j=>DATA.defs[r.idx[j]],df=n(2);s+=`<h3>DISC</h3><p>Mask: <b>${esc(n(0)?.title||"-")}</b> · Core: <b>${esc(n(1)?.title||"-")}</b> · Mirror: <b>${esc(df?.title||"-")}</b></p>${df?`<p class="m">Job match: ${esc(df.job)}</p>`:""}`}
if(p){const sr=[...papiCalc(p.A)].sort((a,b)=>b.v-a.v),li=r=>`<li><b>${r.k} · ${esc(r.f)}</b> (${r.v}/9): ${esc(r.x)}</li>`;s+=`<h3>PAPI Kostick</h3><p>Tiga faktor dengan skor tertinggi:</p><ul>${sr.slice(0,3).map(li).join("")}</ul><p>Tiga faktor dengan skor terendah:</p><ul>${sr.slice(-3).reverse().map(li).join("")}</ul>`}
if(k){const r=krpCalc(k.C);s+=`<h3>Kraepelin</h3><p>Panker ${f(r.pan)} · Tianker ${r.tian} · Janker ${r.jan} · Hanker ${f(r.han)} · Total dikerjakan ${r.tot}</p><p class="m">Kategori mengikuti tabel norma lembaga.</p>`}
const miss=[!d&&"DISC",!p&&"PAPI Kostick",!k&&"Kraepelin"].filter(Boolean);
const sec=(n,h)=>`<h2 style="margin:22px 0 10px">${n}</h2>${h}`;
V.innerHTML=`<div class="c"><div class="row"><div><h2>${esc(g.name)} <span class="m">· Laporan gabungan</span></h2><p class="m">${esc(x0.sex)} · ${esc(x0.age)} tahun · tes: ${[d&&"DISC",p&&"PAPI Kostick",k&&"Kraepelin"].filter(Boolean).join(", ")}</p>${miss.length?`<p class="m">Belum dikerjakan: ${miss.join(", ")}</p>`:""}</div>
<div class="no"><button class="s" id="pr">Cetak</button> <button class="s" id="dl">Unduh laporan</button> <button id="bk">Kembali</button></div></div></div>
<div class="c"><h2>Ringkasan hasil</h2>${s}</div>
<div class="c"><h2>Kesimpulan asesor</h2><p class="m no">Tulis kesimpulan dan rekomendasi di sini. Isinya ikut tercantum di laporan yang diunduh atau dicetak (belum tersimpan otomatis).</p><textarea id="kt" rows="6" style="width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)"></textarea></div>
${d?sec("Detail hasil DISC",bodyDisc(d)):""}${p?sec("Detail hasil PAPI Kostick",bodyPapi(p)):""}${k?sec("Detail hasil Kraepelin",bodyKrp(k)):""}<p class="m">Hasil bersifat indikatif dan perlu diinterpretasikan oleh psikolog atau asesor yang berwenang.</p>`;
pr.onclick=()=>{try{window.print()}catch(e){}};bk.onclick=admin;
dl.onclick=async()=>{const inner=V.innerHTML.replace(/<div class="no">[\s\S]*?<\/div>/,"").replace(/<p class="m no">[\s\S]*?<\/p>/,"").replace(/<textarea[\s\S]*?<\/textarea>/,`<p style="white-space:pre-wrap">${esc(kt.value)||"-"}</p>`),h=repDoc(inner,g.name),fn="laporan-gabungan-"+g.name.replace(/\W+/g,"-")+".html";
if(DL){try{await DL.save({filename:fn,data:h});return}catch(e){}}dlf(fn,h,"text/html")}}
function ring(x){if(x.test==="kraepelin"){const r=krpCalc(x.C);return"Panker "+Math.round(r.pan*100)/100+", Tianker "+r.tian+", Janker "+r.jan}if(x.test==="papi"){const R=papiCalc(x.A).sort((a,b)=>b.v-a.v).slice(0,3);return"Tertinggi: "+R.map(r=>r.k+" ("+r.v+")").join(", ")}return calc(x.P,x.K).idx.map(k=>DATA.defs[k]?.title||"-").join(" / ")}
function adminView(a){const G=groups(a);
V.innerHTML=`<div class="c"><div class="row"><h2>Hasil tersimpan (${a.length})</h2><div><button class="s" id="dx" ${a.length?"":"disabled"}>Ekspor CSV</button> <button class="s" id="cl" ${a.length?"":"disabled"}>Hapus semua</button></div></div>
<p class="m">${MODE==="web"?"Data diambil dari server. Ekspor CSV secara berkala sebagai cadangan.":"Sumber lokal hanya ada di perangkat ini; sumber bersama dikumpulkan dari peserta lain (jika tersedia). Ekspor secara berkala."}</p>
${grp(G)}<div class="tw"><table><tr><th>Tanggal</th><th>Tes</th><th>Nama</th><th>Usia</th><th>Ringkasan</th><th>Sumber</th><th></th></tr>
${a.map((x,n)=>`<tr><td>${esc(x.date)}</td><td>${x.test==="papi"?"PAPI":x.test==="kraepelin"?"Kraepelin":"DISC"}</td><td>${esc(x.name)}</td><td>${esc(x.age)}</td><td>${esc(ring(x))}</td><td>${esc(x.src||"")}</td><td><button class="s" data-n="${n}">Lihat</button></td></tr>`).join("")}</table></div><p class="no"><button class="s" id="mn">Menu tes</button></p></div>`;
V.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>result(a[+b.dataset.n],true));mn.onclick=()=>{location.hash="";home()};V.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>combined(G[+b.dataset.g]));
dx.onclick=()=>{const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',D=["mask","core","mirror"],L="DISC".split(""),
h=["tanggal","tes","nama","usia","jenis_kelamin","durasi_menit","kosong",...D.flatMap(l=>L.map(c=>l+"_"+c)),...D.map(l=>l+"_tipe"),...PAPI.sc.map(s=>"PAPI_"+s.k),"kraepelin_panker","kraepelin_tianker","kraepelin_janker","kraepelin_hanker","kraepelin_total"];
const rows=a.map(x=>{const p=x.test==="papi",kr=x.test==="kraepelin",kos=kr?x.C.filter(c=>!c.a.length).length:p?x.A.filter(v=>v<0).length:x.P.filter(v=>v<0).length+x.K.filter(v=>v<0).length;let d=Array(15).fill(""),e=Array(20).fill(""),k=Array(5).fill("");
if(kr){const r=krpCalc(x.C);k=[r.pan,r.tian,r.jan,r.han,r.tot].map(v=>Math.round(v*100)/100)}else if(p)e=papiCalc(x.A).map(r=>r.v);else{const r=calc(x.P,x.K);d=[...r.L.flatMap(v=>L.map(c=>v[c])),...r.idx.map(k=>DATA.defs[k]?.title||"")]}
return[x.date,kr?"Kraepelin":p?"PAPI":"DISC",x.name,x.age,x.sex,x.minutes,kos,...d,...e,...k].map(q).join(",")});
dlf("hasil-psikotes.csv",[h.join(","),...rows].join("\n"),"text/csv")};
cl.onclick=()=>{if(cl.dataset.s){ST.clear().then(admin)}else{cl.dataset.s=1;cl.textContent=MODE==="web"?"Klik lagi: arsipkan semua":"Klik lagi: hapus data lokal"}}}
function route(){const h=location.hash.slice(1);locked=!!TESTS.find(t=>t.id===h);if(h==="admin")admin();else if(locked)pilih(h);else home()}
onhashchange=route;
if(MODE==="art"){ft.innerHTML=`<a href="#admin" id="fa" style="color:inherit">Admin</a>`;fa.onclick=e=>{e.preventDefault();admin()}}
route();
</script></body></html>
